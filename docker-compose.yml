version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DTPT_ENABLE_ATTACK_SIMULATION=true

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend